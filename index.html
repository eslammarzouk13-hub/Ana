<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TC24 | إدارة صيانة المكيفات والمبيعات</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
    
    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      padding: 20px 24px;
      border-radius: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.5rem; display: flex; align-items: center; gap: 12px; }
    header h1 i { color: #38bdf8; }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      border-right: 5px solid var(--primary);
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .stat-card.success { border-color: var(--success); }
    .stat-card.accent { border-color: var(--accent); }
    .stat-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 6px; }
    .stat-value { font-size: 1.5rem; font-weight: bold; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      gap: 20px;
    }
    @media (max-width: 950px) { .grid-2 { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      margin-bottom: 24px;
    }
    .card h3 { margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: #38bdf8; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .form-control:focus { border-color: var(--primary); }

    /* تنسيق شبكة الأقسام المستقلة للخدمات */
    .services-checkboxes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: #0f172a;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checkbox-item input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn-secondary { background: #475569; width: auto; }
    .btn-secondary:hover { background: #334155; }
    .btn-print-client { background: #059669; padding: 6px 12px; font-size: 0.85rem; width: auto; border-radius: 6px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 14px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { background: #0f172a; color: var(--text-muted); font-size: 0.85rem; }

    @media print {
      body { background: white !important; color: black !important; padding: 0; }
      header, .nav-tabs, .form-container, .btn, .no-print { display: none !important; }
      .card { border: none; box-shadow: none; background: white !important; color: black !important; }
      table { border: 1px solid #ddd; }
      th, td { border: 1px solid #ddd; color: black !important; }
      th { background: #f3f4f6 !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-snowflake"></i> تكنيكال 24 - قسم الصيانة والمبيعات</h1>
    <button class="btn btn-secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الشامل</button>
  </header>

  <div class="nav-tabs">

    <button class="tab-btn" onclick="switchTab('employees')"><i class="fa-solid fa-users"></i> الموظفون والفنيون</button>
  </div>

  <div id="sales" class="tab-content active">

        <div class="stat-value" id="stat-count">0</div>

      <div class="stat-card accent">
        <div class="stat-title">متوسط قيمة الخدمة</div>
        <div class="stat-value" id="stat-avg">0 ر.س</div>
      </div>
    </div>

            <input type="text" id="clientName" class="form-control" required placeholder="مثال: محمد العمري">
          </div>

              <label class="checkbox-item"><input type="checkbox" name="servicePart" value="تنظيف الاسبلت"> تنظيف الاسبلت</label>
