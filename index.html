<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC24</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif}
body{background:#fdfbf7}
header{background:#78350f;color:#fff;padding:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
nav{background:#fff;padding:10px;display:flex;gap:8px;overflow-x:auto;position:sticky;top:0}
.nav-btn{flex:1;white-space:nowrap;padding:11px;border:1px solid #e5e7eb;background:#f9fafb;border-radius:10px;font-weight:800;cursor:pointer}
.nav-btn.active{background:#78350f;color:#fff}
.page{display:none;padding:20px;max-width:1000px;margin:auto}
.page.active{display:block}
.banner{background:#fef3c7;padding:12px;border-radius:12px;margin-bottom:14px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;padding:16px;border-radius:12px;border:1px solid #e5e7eb;border-right:6px solid #78350f}
.stat b{color:#78350f;font-size:1.3rem}
.card{background:#fff;padding:20px;border-radius:14px;border:1px solid #e5e7eb;margin-bottom:16px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:.9rem}
input,select{width:100%;padding:11px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa}
.btn{width:100%;padding:12px;background:#78350f;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-top:12px}
.btn2{padding:8px 12px;background:#fff;color:#78350f;border:2px solid #fde68a;border-radius:10px;font-weight:800;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:.9rem}
th{background:#fef3c7;color:#78350f}
.act{border:none;padding:6px 9px;border-radius:6px;color:#fff;cursor:pointer}
.del{background:#dc2626}.wa{background:#25d366}.edit{background:#d97706}
</style>
</head>
<body>

<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#78350f;padding:20px;">
  <div style="background:#fff;width:100%;max-width:380px;padding:26px;border-radius:18px;text-align:center;">
    <div style="font-size:45px;">❄️</div>
    <h1 style="color:#78350f;">TC24</h1>
    <h3>دخول الأدمن</h3>
    <div style="text-align:right;margin-top:12px;">
      <label>اسم المستخدم</label><input id="loginUser">
      <label>كلمة المرور</label><input id="loginPass" type="password">
      <p id="loginError" style="color:red;font-weight:700;display:none;">غلط، جرب تاني</p>
      <button class="btn" onclick="doLogin()">دخول</button>
    </div>
    <p style="background:#fef3c7;padding:8px;border-radius:8px;margin-top:12px;font-size:.85rem;">admin / 123456</p>
  </div>
</div>

<div id="appScreen" style="display:none;">
<header><h2>❄️ تكنيكال 24 - SP3</h2><button class="btn2" onclick="logout()">خروج</button></header>
<nav>
  <button class="nav-btn active" onclick="goPage('p1',this)">1. العملاء</button>
  <button class="nav-btn" onclick="goPage('p2',this)">2. البحث</button>
  <button class="nav-btn" onclick="goPage('p3',this)">3. التقارير</button>
  <button class="nav-btn" onclick="goPage('p4',this)">4. الصيانة</button>
</nav>
<section id="p1" class="page active">
  <div class="banner">نسخة تجريبية جاهزة - اكتب admin / 123456 ودخلت</div>
  <div class="stats">
    <div class="stat">إجمالي<br><b id="sTotal">0</b></div>
    <div class="stat">عدد العملاء<br><b id="sCount">0</b></div>
  </div>
  <div class="card"><h3>سجل العملاء التجريبي</h3><table><thead><tr><th>الكود</th><th>العميل</th><th>المبلغ</th><th>إجراء</th></tr></thead><tbody id="salesBody"></tbody></table></div>
  <div class="card"><h3>إضافة عميل</h3>
    <label>الكود</label><input id="clientCode">
    <label>الاسم</label><input id="clientName">
    <label>الجوال</label><input id="clientPhone">
    <label>التكلفة</label><input id="serviceCost" type="number">
    <button class="btn" onclick="addSale()">حفظ العميل</button>
  </div>
</section>
<section id="p2" class="page"><div class="card"><h3>البحث</h3><input id="searchInput" placeholder="ابحث بالاسم..." oninput="filterData()"><div id="searchResult" style="margin-top:12px;"></div></div></section>
<section id="p3" class="page"><div class="card"><h3>التقارير</h3><canvas id="monthlyChart" height="200"></canvas></div></section>
<section id="p4" class="page"><div class="card"><h3>الصيانة الدورية</h3><div id="maintResult"></div></div></section>
</div>

<!-- سكربت الدخول لوحده، قبل أي حاجة تانية -->
<script>
function doLogin(){
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value.trim();
  if(u === 'admin' && p === '123456'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    renderSales();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
function logout(){ location.reload(); }
function goPage(id,btn){
  var pages = document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++){ pages[i].classList.remove('active'); }
  document.getElementById(id).classList.add('active');
  var btns = document.querySelectorAll('.nav-btn');
  for(var j=0;j<btns.length;j++){ btns[j].classList.remove('active'); }
  btn.classList.add('active');
  if(id==='p3'){ renderChart(); }
  if(id==='p4'){ renderMaint(); }
}
</script>

<!-- سكربت البيانات لوحده -->
<script>
var salesData = [
  {code:"TC-1001",client:"محمد العمري",phone:"0551234567",cost:1200,date:"2026-11-02"},
  {code:"TC-1002",client:"سارة الأحمد",phone:"0559876543",cost:850,date:"2026-10-15"},
  {code:"TC-1006",client:"عميل قديم",phone:"0555551234",cost:1500,date:"2026-04-10"}
];
function renderSales(){
  var total = 0, html = '';
  for(var i=0;i<salesData.length;i++){
    total = total + Number(salesData[i].cost);
    html += '<tr><td>'+salesData[i].code+'</td><td>'+salesData[i].client+'</td><td>'+salesData[i].cost+' ر.س</td><td><button class="act wa" onclick="sendWA('+i+')">واتساب</button> <button class="act del" onclick="deleteSale('+i+')">حذف</button></td></tr>';
  }
  document.getElementById('salesBody').innerHTML = html;
  document.getElementById('sTotal').innerText = total + ' ر.س';
  document.getElementById('sCount').innerText = salesData.length;
}
function addSale(){
  var code = document.getElementById('clientCode').value;
  var name = document.getElementById('clientName').value;
  var phone = document.getElementById('clientPhone').value;
  var cost = document.getElementById('serviceCost').value;
  if(!name || !cost){ alert('اكتب الاسم والتكلفة'); return; }
  salesData.unshift({code:code,client:name,phone:phone,cost:cost,date:"2026-11-10"});
  renderSales();
}
function deleteSale(i){ salesData.splice(i,1); renderSales(); }
function sendWA(i){
  var s = salesData[i];
  var msg = 'مرحبا ' + s.client + '، فاتورتك ' + s.cost + ' ريال من تكنيكال 24';
  window.open('https://wa.me/' + s.phone + '?text=' + encodeURIComponent(msg), '_blank');
}
function filterData(){
  var q = document.getElementById('searchInput').value;
  var out = '';
  for(var i=0;i<salesData.length;i++){
    if(salesData[i].client.indexOf(q) !== -1){ out += '<p>✅ ' + salesData[i].client + ' - ' + salesData[i].cost + ' ر.س</p>'; }
  }
  document.getElementById('searchResult').innerHTML = out || 'لا توجد نتائج';
}
function renderMaint(){
  document.getElementById('maintResult').innerHTML = '<p>⚠️ عميل قديم: TC-1006 - آخر صيانة 2026-04-10 - عدى عليه أكتر من 6 شهور</p><button class="btn" onclick="sendWA(2)">إرسال تذكير واتساب</button>';
}
function renderChart(){
  var ctx = document.getElementById('monthlyChart');
  if(!ctx) return;
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['ابريل','اكتوبر','نوفمبر'],
      datasets: [{ label: 'المبيعات', data: [1500,850,1200] }]
    }
  });
}
renderSales();
</script>
</body>
</html>
